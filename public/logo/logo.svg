<svg width="140" height="50" viewBox="0 0 140 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  
  <!-- Monogram Emblem -->
  <rect x="2" y="5" width="40" height="40" rx="10" stroke="url(#purpleGrad)" stroke-width="2" fill="#180b2e" />
  <text x="11" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="url(#purpleGrad)">T</text>
  <text x="23" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#ffffff">B</text>
  
  <!-- Text Brand -->
